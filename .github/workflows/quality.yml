name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Stage an ephemeral CI font (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf resources/fonts/CiTestFont.ttf
      - name: Stage an ephemeral CI font (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $font = Get-ChildItem -Path "$env:WINDIR\Fonts" -Filter "*arial*.ttf" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $font) {
            $font = Get-ChildItem -Path "$env:WINDIR\Fonts" -Filter "*.ttf" | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $font) {
            throw "Required Windows CI font was not found in $env:WINDIR\Fonts"
          }
          New-Item -ItemType Directory -Force -Path 'resources\fonts'
          Copy-Item -Path $font -Destination 'resources\fonts\CiTestFont.ttf' -Force
      - name: Compile Python sources
        run: python -m compileall -q config.py gui.py src tools tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  quality-gates:
    name: lint, format, types, integrity, and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Lint repository
        run: python -m ruff check .
      - name: Check incremental formatting baseline
        run: >-
          python -m ruff format --check
          tests/test_ci_integrity_smoke.py
          tests/test_repository_contract.py
      - name: Check typed contracts
        run: python -m mypy
      - name: Exercise dataset-integrity validator
        run: python -m unittest tests.test_ci_integrity_smoke -v
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv",
    "dataset",
    "kaggle-code/*.ipynb",
]

[tool.ruff.lint]
# Keep the first repository-wide gate focused on correctness and syntax. A
# dedicated formatting change can broaden this baseline without obscuring
# functional changes in the generator.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = [
    "src/manifest.py",
    "src/image_preprocessing.py",
]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true

# Type checking starts with the small, explicitly typed data contracts above.
# Add modules here as their annotations are completed; do not suppress new
# errors by globally ignoring them.
